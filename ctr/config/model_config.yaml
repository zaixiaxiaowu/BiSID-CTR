Base:
  batch_norm: false
  batch_size: 1024
  debug: false
  embedding_dim: 32
  embedding_regularizer: 0
  epochs: 100
  every_x_epochs: 1
  hidden_activations: relu
  hidden_units: [128, 128]
  learning_rate: 0.001
  loss: binary_crossentropy
  metrics: [logloss, AUC]
  monitor: AUC
  monitor_mode: max
  net_dropout: 0
  net_regularizer: 0
  num_workers: 0
  optimizer: adam
  patience: 10
  pickle_feature_encoder: true
  save_best_only: true
  seed: 2024
  shuffle: true
  task: binary_classification
  use_hdf5: true
  verbose: 1
  embedding_initializer: "torch.nn.init.normal_(std=1e-4)"

DeepFM_gift:
  dataset_id: gift
  model: DeepFM
  model_id: DeepFM_gift
  model_root: ./checkpoint/gift/DeepFM/

DeepFM_game:
  dataset_id: game
  model: DeepFM
  model_id: DeepFM_game
  model_root: ./checkpoint/game/DeepFM/

DeepFM_music:
  dataset_id: music
  model: DeepFM
  model_id: DeepFM_music
  model_root: ./checkpoint/music/DeepFM/

DIN_gift:
  dataset_id: gift_seq
  model: DIN
  model_id: DIN_gift
  model_root: ./checkpoint/gift/DIN/
  target_field: parent_asin
  sequence_field: item_hist
  attention_hidden_units: [64]
  din_use_softmax: true

DIN_game:
  dataset_id: game_seq
  model: DIN
  model_id: DIN_game
  model_root: ./checkpoint/game/DIN/
  target_field: parent_asin
