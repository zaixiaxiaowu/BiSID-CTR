  target_field: parent_asin
  sequence_field: item_hist
  attention_hidden_units: [64]
  din_use_softmax: true

BST_gift:
  dataset_id: gift_seq
  model: BST
  model_id: BST_gift
  model_root: ./checkpoint/gift/BST/
  num_heads: 4
  transformer_layers: 1
